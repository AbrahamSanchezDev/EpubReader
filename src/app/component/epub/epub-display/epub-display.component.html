<div class="book">
  <h1 class="book-title">{{ getBookName() }}</h1>

  <div #content class="pages-parent">
    @for (obj of getContent(); track obj.name || $index) {
      <div
        [innerHTML]="obj.content"
        class="book-content"
      ></div>
    } @empty {
      <p class="loading-text">Loading book content...</p>
    }
  </div>
</div>
