@if (showOptions()) {
  <div class="reader-options">
    <div class="lowerMenu">
      @if (reading()) {
        <button (click)="readPreviews()">&lt;</button>
      }

      <button (click)="toggleRead()">{{ getReadText() }}</button>

      @if (reading()) {
        <button (click)="readNext()">&gt;</button>
      }
    </div>

    <div class="chapters">
      <button (click)="showChapters()">Chapters</button>
    </div>
  </div>
}
